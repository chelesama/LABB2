<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Interactivo</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <main class="container">

        <header>
            <h1 id="titulo">Panel Interactivo</h1>
        </header>

        <section class="cards">
            <div class="card">Proyecto A</div>
            <div class="card">Proyecto B</div>
            <div class="card">Proyecto C</div>
        </section>

        <section class="controls">
            <input type="text" id="inputTexto" placeholder="Escribe una tarea...">
            <button id="btnCambiar">Cambiar Título</button>
            <button class="btnColor glow">Modo Oscuro</button>
            <button id="btnAgregar" class="glow">Agregar Tarea</button>
        </section>

        <div id="mensaje"></div>

        <ul id="lista">
            <li>Tarea 1</li>
            <li>Tarea 2</li>
        </ul>

        <footer>
            <a href="#" id="miEnlace">Mostrar mensaje</a>
        </footer>

    </main>

    <script src="scrip.js"></script>
</body>
</html>
